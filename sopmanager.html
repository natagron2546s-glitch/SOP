<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F1B2D;--steel:#1E3A5F;--accent:#00B4D8;--accent2:#0096b5;
  --bg:#F0F4F8;--surface:#ffffff;--surface2:#F7FAFC;--surface3:#EEF2F7;
  --text:#1A1A2E;--muted:#6B7280;--border:#E2E8F0;--border2:#CBD5E1;
  --tag-problem-bg:#FEF3C7;--tag-problem:#92400E;
  --tag-fixture-bg:#DBEAFE;--tag-fixture:#1E40AF;
  --tag-customer-bg:#F0FDF4;--tag-customer:#166534;
  --radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:240px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo{display:flex;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:600;margin-bottom:2px}
.sidebar-logo i{font-size:18px;color:var(--accent)}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.45);margin-left:26px}
.folder-list{flex:1;overflow-y:auto;padding:8px 0}
.folder-list::-webkit-scrollbar{width:4px}.folder-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.folder-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;color:rgba(255,255,255,.65);font-size:13px;position:relative;transition:all .15s;user-select:none}
.folder-item:hover{background:rgba(255,255,255,.08);color:#fff}
.folder-item.active{background:rgba(0,180,216,.15);colorvar(--accent)}
.folder-item i.folder-icon{font-size:16px;flex-shrink:0}
.folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-size:11px;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px;flex-shrink:0}
.folder-item.active .folder-count{background:rgba(0,180,216,.25);color:var(--accent)}
.folder-edit-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);padding:2px 4px;border-radius:4px;display:none;font-size:13px;line-height:1}
.folder-item:hover .folder-edit-btn{display:block}
.folder-item:hover .folder-edit-btn:hover{color:var(--accent)}
.folder-add-btn{margin:8px 12px 14px;display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px dashed rgba(255,255,255,.2);border-radius:var(--radius);background:none;cursor:pointer;color:rgba(255,255,255,.45);font-size:12px;width:calc(100% - 24px);transition:all .15s;font-family:inherit}
.folder-add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,180,216,.08)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.search-wrap{position:relative;flex:1}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-wrap input{width:100%;height:36px;padding:0 10px 0 34px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface2);color:var(--text);transition:border .15s}
.search-wrap input:focus{outline:none;border-color:var(--accent);background:#fff}
.filter-sel{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;background:var(--surface2);color:var(--text);cursor:pointer;min-width:130px}
.filter-sel:focus{outline:none;border-color:var(--accent)}
.content-area{flex:1;display:flex;overflow:hidden}

/* SOP List */
.sop-list-panel{width:310px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.list-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
.list-count{font-size:12px;color:var(--muted)}
.import-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;transition:background .15s}
.import-btn:hover{background:var(--accent2)}
.sop-items{flex:1;overflow-y:auto}
.sop-items::-webkit-scrollbar{width:4px}.sop-items::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.sop-card{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.sop-card:hover{background:var(--surface2)}
.sop-card.active{background:#EFF9FD;border-left:3px solid var(--accent)}
.sop-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:5px;line-height:1.4}
.sop-card.active .sop-title{color:var(--accent2)}
.sop-meta{display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag i{font-size:10px}
.tag-p{background:var(--tag-problem-bg);color:var(--tag-problem)}
.tag-f{background:var(--tag-fixture-bg);color:var(--tag-fixture)}
.tag-c{background:var(--tag-customer-bg);color:var(--tag-customer)}
.tag-folder{background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.empty-list{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:10px;padding:30px;text-align:center}
.empty-list i{font-size:36px;opacity:.25}
.empty-list p{font-size:13px;line-height:1.6}

/* Detail */
.sop-detail{flex:1;overflow-y:auto;background:var(--bg)}
.sop-detail::-webkit-scrollbar{width:6px}.sop-detail::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:12px}
.detail-empty i{font-size:48px;opacity:.2}
.detail-empty p{font-size:13px}
.detail-content{padding:28px 32px;max-width:760px}
.detail-toolbar{display:flex;gap:8px;margin-bottom:20px}
.detail-toolbar button{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:12px;color:var(--muted);font-family:inherit;transition:all .15s}
.detail-toolbar button:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.detail-toolbar button.danger:hover{border-color:#FCA5A5;color:#DC2626;background:#FEF2F2}
.detail-title{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:14px;line-height:1.4}
.detail-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.detail-tags .tag{font-size:12px;padding:5px 12px}
.section{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.section-text{font-size:13px;color:#374151;line-height:1.8}
.steps-list{display:flex;flex-direction:column;gap:8px}
.step-item{display:flex;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;color:var(--text);line-height:1.6}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:14px;padding:26px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal::-webkit-scrollbar{width:4px}.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.modal-header{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.modal-header i{font-size:20px;color:var(--accent)}
.modal-header h3{font-size:15px;font-weight:600;color:var(--navy)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:inherit;color:var(--text);background:var(--surface2);transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.form-group textarea{resize:vertical;min-height:72px;line-height:1.6}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps-builder{display:flex;flex-direction:column;gap:6px}
.step-row{display:flex;gap:6px;align-items:center}
.step-row input{flex:1}
.step-row button{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-row button:hover{border-color:#FCA5A5;color:#DC2626;background:#FEF2F2}
.add-step-btn{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1px dashed var(--border2);border-radius:var(--radius);background:none;cursor:pointer;color:var(--muted);font-size:12px;font-family:inherit;transition:all .15s;margin-top:4px}
.add-step-btn:hover{border-color:var(--accent);color:var(--accent);background:#F0FDFF}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.btn-cancel{padding:8px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit}
.btn-cancel:hover{background:var(--surface3)}
.btn-primary{padding:8px 18px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:background .15s}
.btn-primary:hover{background:var(--accent2)}
.upload-area{border:2px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:8px}
.upload-area:hover{border-color:var(--accent);background:#F0FDFF}
.upload-area i{font-size:30px;color:var(--muted);display:block;margin-bottom:6px}
.upload-area p{font-size:12px;color:var(--muted);line-height:1.6}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
input[type=file]{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:200;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i class="ti ti-book-2"></i>SOP Manager</div>
      <div class="sidebar-sub">คลังขั้นตอนการแก้ไขปัญหา</div>
    </div>
    <div class="folder-list" id="folderList"></div>
    <button class="folder-add-btn" onclick="openFolderModal()"><i class="ti ti-folder-plus"></i>เพิ่มโฟลเดอร์ใหม่</button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-wrap" style="flex:1">
        <i class="ti ti-search"></i>
        <input type="text" id="searchInput" placeholder="ค้นหาจากปัญหา, เครื่อง fixture, ลูกค้า..." oninput="filterSOPs()">
      </div>
      <select class="filter-sel" id="filterCustomer" onchange="filterSOPs()"><option value="">ลูกค้าทั้งหมด</option></select>
      <select class="filter-sel" id="filterFixture" onchange="filterSOPs()"><option value="">Fixture ทั้งหมด</option></select>
    </div>
    <div class="content-area">
      <div class="sop-list-panel">
        <div class="list-header">
          <span class="list-count" id="listCount">0 รายการ</span>
          <button class="import-btn" onclick="openImportModal()"><i class="ti ti-plus"></i>เพิ่ม / นำเข้า SOP</button>
        </div>
        <div class="sop-items" id="sopItems"></div>
      </div>
      <div class="sop-detail" id="sopDetail">
        <div class="detail-empty">
          <i class="ti ti-file-description"></i>
          <p>เลือก SOP เพื่อดูรายละเอียด</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="folderModal" style="display:none" onclick="if(event.target===this)closeFolderModal()">
  <div class="modal">
    <div class="modal-header"><i class="ti ti-folder-plus"></i><h3>สร้างโฟลเดอร์ใหม่</h3></div>
    <div class="form-group"><label>ชื่อโฟลเดอร์</label><input id="newFolderName" placeholder="เช่น Line A, Product X, ลูกค้า Toyota" onkeydown="if(event.key==='Enter')addFolder()"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeFolderModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="addFolder()">สร้างโฟลเดอร์</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="folderSettingsModal" style="display:none" onclick="if(event.target===this)closeFolderSettingsModal()">
  <div class="modal">
    <div class="modal-header"><i class="ti ti-settings"></i><h3>ตั้งค่าการจัดการโฟลเดอร์</h3></div>
    <div class="form-group">
      <label>ชื่อโฟลเดอร์</label>
      <input id="editFolderName" placeholder="ระบุชื่อโฟลเดอร์">
    </div>
    <div class="form-group">
      <label>ไอคอนสัญลักษณ์</label>
      <select id="editFolderIcon" style="width: 100%;">
        <option value="ti-folder">📁 โฟลเดอร์มาตรฐาน (Default)</option>
        <option value="ti-device-cpu">💻 ไลน์การผลิต / ICT / FCT</option>
        <option value="ti-tool">🔧 ซ่อมบำรุง / เครื่องมือ / Fixture</option>
        <option value="ti-building">🏢 คลังสินค้า / ลูกค้า (Customer)</option>
        <option value="ti-user">👤 แผนก / ผู้รับผิดชอบ</option>
        <option value="ti-alert-triangle">⚠️ เคสเร่งด่วน / งานเคลม</option>
      </select>
    </div>
    <div class="modal-footer" style="justify-content: space-between;">
      <button class="btn-cancel" style="border-color:#FCA5A5; color:#DC2626; background:#FEF2F2" onclick="deleteFolderFromSettings()">
        <i class="ti ti-trash" style="margin-right: 4px;"></i>ลบโฟลเดอร์
      </button>
      <div style="display: flex; gap: 8px;">
        <button class="btn-cancel" onclick="closeFolderSettingsModal()">ยกเลิก</button>
        <button class="btn-primary" onclick="saveFolderSettings()"><i class="ti ti-device-floppy" style="margin-right: 4px;"></i>บันทึก</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="importModal" style="display:none" onclick="if(event.target===this)closeImportModal()">
  <div class="modal">
    <div class="modal-header"><i class="ti ti-upload"></i><h3>เพิ่ม / นำเข้า SOP</h3></div>
    <div class="form-group">
      <label>โฟลเดอร์ปลายทาง</label>
      <select id="importFolder"></select>
    </div>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <i class="ti ti-file-upload"></i>
      <p><strong>คลิกเพื่อ Import ไฟล์ JSON</strong><br>รองรับไฟล์ที่ Export จากระบบนี้</p>
    </div>
    <input type="file" id="fileInput" accept=".json" onchange="handleFileImport(event)">
    <div class="divider">หรือกรอกข้อมูลด้วยตนเอง</div>
    <div class="form-group"><label>ชื่อ SOP / ปัญหา <span style="color:#EF4444">*</span></label><input id="sopTitle" placeholder="เช่น สัญญาณ PASS ไม่ขึ้นหลังวัดค่า Resistance"></div>
    <div class="form-grid">
      <div class="form-group"><label>เครื่อง Fixture</label><input id="sopFixture" placeholder="เช่น ICT-01, FCT-03"></div>
      <div class="form-group"><label>ลูกค้า</label><input id="sopCustomer" placeholder="เช่น Toyota, Bosch"></div>
    </div>
    <div class="form-group"><label>อาการ / สาเหตุที่เป็นไปได้</label><textarea id="sopDesc" placeholder="อธิบายอาการที่พบ หรือสาเหตุที่เป็นไปได้"></textarea></div>
    <div class="form-group">
      <label>ขั้นตอนการแก้ไข</label>
      <div class="steps-builder" id="stepsInput">
        <div class="step-row"><input placeholder="ขั้นตอนที่ 1..."><button onclick="removeStep(this)" title="ลบ"><i class="ti ti-x"></i></button></div>
      </div>
      <button class="add-step-btn" onclick="addStepInput()"><i class="ti ti-plus"></i>เพิ่มขั้นตอน</button>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeImportModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="saveManualSOP()"><i class="ti ti-device-floppy" style="margin-right:4px"></i>บันทึก SOP</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'sop_manager_v2';
let store = {
  folders: [
    {id:'f1', name:'Line A - ICT', icon:'ti-device-cpu'},
    {id:'f2', name:'Line B - FCT', icon:'ti-device-cpu'},
    {id:'f3', name:'ลูกค้า Toyota', icon:'ti-building'},
  ],
  sops: [
    {id:'s1',folderId:'f1',title:'สัญญาณ PASS ไม่ขึ้นหลังวัดค่า Resistance',problem:'PASS ไม่ขึ้น',fixture:'ICT-01',customer:'Toyota',desc:'พบปัญหา Board ผ่านการทดสอบแต่สัญญาณ PASS ไม่แสดงผล อาจเกิดจาก relay หรือ contact probe สกปรก',steps:['ปิดเครื่อง ICT-01 และถอดปลั๊ก','ตรวจสอบ Contact Probe บน Fixture ว่าสกปรกหรือไม่','ทำความสะอาด Probe ด้วย IPA และแปรงขนอ่อน','ตรวจสอบ Relay ในส่วน Signal Output ว่าทำงานปกติ','เปิดเครื่องและทดสอบซ้ำ 3 ครั้งเพื่อยืนยัน']},
    {id:'s2',folderId:'f1',title:'ค่า Resistance อ่านได้สูงผิดปกติ',problem:'Resistance ผิดพลาด',fixture:'ICT-01',customer:'Toyota',desc:'Resistance อ่านได้สูงกว่า Spec ทั้งที่ Board ไม่มีปัญหา อาจเกิดจาก Probe wear หรือ Ground ไม่ดี',steps:['ตรวจสอบ Kelvin Probe ว่าสึกหรอหรือไม่','วัด Contact Resistance ของ Probe แต่ละตัว','เปลี่ยน Probe ที่มีค่า Contact Resistance > 0.1Ω','ตรวจสอบ Guard และ Ground Connection','Calibrate เครื่องใหม่ตาม Procedure']},
    {id:'s3',folderId:'f2',title:'FCT ล้มเหลวที่ Power Supply Test',problem:'Power Supply Test Fail',fixture:'FCT-03',customer:'Bosch',desc:'Board ล้มเหลวในขั้นตอน Power Supply Test ทั้งที่ Component ครบ',steps:['ตรวจสอบ Test Sequence ใน Program','วัด Voltage ที่จุด TP1-TP4 ด้วย Oscilloscope','ตรวจ Load Bank ว่ามีค่าตรงกับ Spec หรือไม่','ตรวจสอบ DUT Connector ว่า Contact ดีหรือไม่','Run Diagnostic Mode และบันทึก Log']},
    {id:'s4',folderId:'f3',title:'Barcode Scanner ไม่อ่าน Label',problem:'Barcode อ่านไม่ได้',fixture:'SCAN-01',customer:'Toyota',desc:'Scanner ไม่สามารถอ่าน Barcode บน Label ได้ อาจเกิดจาก Print Quality หรือ Scanner ชำรุด',steps:['ตรวจสอบคุณภาพการพิมพ์ Barcode ด้วย Verifier','Cleaning หัวอ่าน Scanner ด้วย Lens Cleaner','ปรับ Focus และ Gain ของ Scanner','ทดสอบกับ Label ใหม่ที่รู้ว่า OK','หากยังไม่ได้ผล แจ้ง Vendor เพื่อ Calibrate']},
  ],
  activeFolder: null,
  activeSOP: null
};

let currentEditingFolderId = null;

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({folders:store.folders,sops:store.sops})); } catch(e){}
}
function load() {
  try {
    const d = localStorage.getItem(STORE_KEY);
    if (d) { const p = JSON.parse(d); store.folders = p.folders||store.folders; store.sops = p.sops||store.sops; }
  } catch(e){}
}

function toast(msg, icon='ti-check') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="ti ${icon}"></i>${msg}`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

function renderFolders() {
  const el = document.getElementById('folderList');
  const items = [{id:null, name:'ทั้งหมด', icon:'ti-layout-list'}, ...store.folders];
  el.innerHTML = items.map(f => {
    const cnt = f.id ? store.sops.filter(s=>s.folderId===f.id).length : store.sops.length;
    const isActive = store.activeFolder === f.id;
    return `<div class="folder-item${isActive?' active':''}" onclick="selectFolder('${f.id}')">
      <i class="ti ${f.icon||'ti-folder'} folder-icon"></i>
      <span class="folder-name">${f.name}</span>
      <span class="folder-count">${cnt}</span>
      ${f.id ? `<button class="folder-edit-btn" onclick="event.stopPropagation();openFolderSettingsModal('${f.id}')" title="ตั้งค่าโฟลเดอร์"><i class="ti ti-settings"></i></button>` : ''}
    </div>`;
  }).join('');
}

function selectFolder(id) {
  store.activeFolder = (id === 'null' || id === null) ? null : id;
  store.activeSOP = null;
  document.getElementById('sopDetail').innerHTML = `<div class="detail-empty"><i class="ti ti-file-description"></i><p>เลือก SOP เพื่อดูรายละเอียด</p></div>`;
  renderFolders(); filterSOPs();
}

function getFiltered() {
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  const fc = document.getElementById('filterCustomer').value;
  const ff = document.getElementById('filterFixture').value;
  return store.sops.filter(s => {
    if (store.activeFolder && s.folderId !== store.activeFolder) return false;
    if (fc && s.customer !== fc) return false;
    if (ff && s.fixture !== ff) return false;
    if (q && !([s.title,s.problem,s.fixture,s.customer,s.desc,...(s.steps||[])].join(' ').toLowerCase().includes(q))) return false;
    return true;
  });
}

function filterSOPs() {
  const filtered = getFiltered();
  document.getElementById('listCount').textContent = `${filtered.length} รายการ`;
  const el = document.getElementById('sopItems');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-list"><i class="ti ti-search-off"></i><p>ไม่พบ SOP ที่ตรงกับเงื่อนไข<br>ลองเปลี่ยนคำค้นหาหรือตัวกรอง</p></div>`;
    return;
  }
  el.innerHTML = filtered.map(s => `<div class="sop-card${store.activeSOP===s.id?' active':''}" onclick="showSOP('${s.id}')">
    <div class="sop-title">${hl(s.title)}</div>
    <div class="sop-meta">
      ${s.problem?`<span class="tag tag-p"><i class="ti ti-alert-circle"></i>${hl(s.problem)}</span>`:''}
      ${s.fixture?`<span class="tag tag-f"><i class="ti ti-tool"></i>${hl(s.fixture)}</span>`:''}
      ${s.customer?`<span class="tag tag-c"><i class="ti ti-building"></i>${hl(s.customer)}</span>`:''}
    </div>
  </div>`).join('');
  updateDropdowns();
}

function hl(text) {
  const q = document.getElementById('searchInput').value.trim();
  if (!q || !text) return text||'';
  return (text+'').replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark style="background:#FEF08A;padding:0 1px;border-radius:2px">$1</mark>');
}

function updateDropdowns() {
  const customers = [...new Set(store.sops.map(s=>s.customer).filter(Boolean))].sort();
  const fixtures = [...new Set(store.sops.map(s=>s.fixture).filter(Boolean))].sort();
  const fc = document.getElementById('filterCustomer');
  const ff = document.getElementById('filterFixture');
  const cv = fc.value, fv = ff.value;
  fc.innerHTML = `<option value="">ลูกค้าทั้งหมด</option>${customers.map(c=>`<option${cv===c?' selected':''}>${c}</option>`).join('')}`;
  ff.innerHTML = `<option value="">Fixture ทั้งหมด</option>${fixtures.map(f=>`<option${fv===f?' selected':''}>${f}</option>`).join('')}`;
}

function showSOP(id) {
  store.activeSOP = id;
  const s = store.sops.find(x=>x.id===id);
  if (!s) return;
  const folder = store.folders.find(f=>f.id===s.folderId);
  document.getElementById('sopDetail').innerHTML = `<div class="detail-content">
    <div class="detail-toolbar">
      <button class="danger" onclick="deleteSOP('${s.id}')"><i class="ti ti-trash"></i>ลบ SOP</button>
      <button onclick="exportSingle('${s.id}')"><i class="ti ti-download"></i>Export JSON</button>
      <button onclick="exportAll()"><i class="ti ti-file-export"></i>Export ทั้งหมด</button>
    </div>
    <div class="detail-title">${s.title}</div>
    <div class="detail-tags">
      ${s.problem?`<span class="tag tag-p" style="font-size:12px;padding:5px 12px"><i class="ti ti-alert-circle"></i>ปัญหา: ${s.problem}</span>`:''}
      ${s.fixture?`<span class="tag tag-f" style="font-size:12px;padding:5px 12px"><i class="ti ti-tool"></i>Fixture: ${s.fixture}</span>`:''}
      ${s.customer?`<span class="tag tag-c" style="font-size:12px;padding:5px 12px"><i class="ti ti-building"></i>ลูกค้า: ${s.customer}</span>`:''}
      ${folder?`<span class="tag tag-folder" style="font-size:12px;padding:5px 12px"><i class="ti ti-folder"></i>${folder.name}</span>`:''}
    </div>
    ${s.desc?`<div class="section"><div class="section-label">อาการ / สาเหตุ</div><div class="section-text">${s.desc}</div></div>`:''}
    ${s.steps&&s.steps.length?`<div class="section"><div class="section-label">ขั้นตอนการแก้ไข (${s.steps.length} ขั้นตอน)</div><div class="steps-list">${s.steps.map((st,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${st}</div></div>`).join('')}</div></div>`:''}
  </div>`;
  filterSOPs();
}

function deleteSOP(id) {
  if (!confirm('ยืนยันการลบ SOP นี้?')) return;
  store.sops = store.sops.filter(s=>s.id!==id);
  store.activeSOP = null;
  document.getElementById('sopDetail').innerHTML = `<div class="detail-empty"><i class="ti ti-file-description"></i><p>เลือก SOP เพื่อดูรายละเอียด</p></div>`;
  filterSOPs(); renderFolders(); save(); toast('ลบ SOP เรียบร้อย', 'ti-trash');
}

function exportSingle(id) {
  const s = store.sops.find(x=>x.id===id);
  if (!s) return;
  downloadJSON([s], `sop_${s.id}.json`);
  toast('Export สำเร็จ', 'ti-download');
}

function exportAll() {
  downloadJSON(store.sops, 'sop_all_export.json');
  toast(`Export ${store.sops.length} รายการสำเร็จ`, 'ti-download');
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function openFolderModal() {
  document.getElementById('folderModal').style.display = 'flex';
  setTimeout(()=>document.getElementById('newFolderName').focus(), 50);
}
function closeFolderModal() { document.getElementById('folderModal').style.display = 'none'; document.getElementById('newFolderName').value=''; }
function addFolder() {
  const name = document.getElementById('newFolderName').value.trim();
  if (!name) return;
  store.folders.push({id:'f'+Date.now(), name, icon:'ti-folder'});
  closeFolderModal(); renderFolders(); save(); toast('สร้างโฟลเดอร์เรียบร้อย', 'ti-folder-plus');
}

/* ฟังก์ชันเปิด-ปิดและควบคุม Folder Settings Modal */
function openFolderSettingsModal(id) {
  const folder = store.folders.find(f => f.id === id);
  if (!folder) return;
  currentEditingFolderId = id;
  document.getElementById('editFolderName').value = folder.name;
  document.getElementById('editFolderIcon').value = folder.icon || 'ti-folder';
  document.getElementById('folderSettingsModal').style.display = 'flex';
}
function closeFolderSettingsModal() {
  document.getElementById('folderSettingsModal').style.display = 'none';
  currentEditingFolderId = null;
}
function saveFolderSettings() {
  const name = document.getElementById('editFolderName').value.trim();
  const icon = document.getElementById('editFolderIcon').value;
  if (!name) { alert('กรุณากรอกชื่อโฟลเดอร์'); return; }

  const folder = store.folders.find(f => f.id === currentEditingFolderId);
  if (folder) {
    folder.name = name;
    folder.icon = icon;
    renderFolders();
    if(store.activeSOP) showSOP(store.activeSOP); // รีเฟรชหน้า Detail เผื่ออัปเดตแท็กโฟลเดอร์
    save();
    toast('บันทึกการตั้งค่าโฟลเดอร์แล้ว', 'ti-check');
  }
  closeFolderSettingsModal();
}
function deleteFolderFromSettings() {
  if (!currentEditingFolderId) return;
  const id = currentEditingFolderId;
  if (!confirm('ลบโฟลเดอร์นี้? SOP ในโฟลเดอร์จะยังคงอยู่ในระบบ (ถูกย้ายออกไปอยู่ส่วนกลาง)')) return;
  store.folders = store.folders.filter(f=>f.id!==id);
  store.sops.forEach(s=>{ if(s.folderId===id) s.folderId=null; });
  if (store.activeFolder===id) store.activeFolder=null;
  closeFolderSettingsModal();
  renderFolders(); filterSOPs(); save(); toast('ลบโฟลเดอร์เรียบร้อย', 'ti-trash');
}

function openImportModal() {
  const sel = document.getElementById('importFolder');
  sel.innerHTML = `<option value="">ไม่ระบุโฟลเดอร์</option>` + store.folders.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');
  if (store.activeFolder) sel.value = store.activeFolder;
  document.getElementById('importModal').style.display = 'flex';
}
function closeImportModal() {
  document.getElementById('importModal').style.display = 'none';
  ['sopTitle','sopFixture','sopCustomer','sopDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('stepsInput').innerHTML = `<div class="step-row"><input placeholder="ขั้นตอนที่ 1..."><button onclick="removeStep(this)" title="ลบ"><i class="ti ti-x"></i></button></div>`;
  document.getElementById('fileInput').value = '';
}

function addStepInput() {
  const c = document.getElementById('stepsInput');
  const n = c.children.length + 1;
  const row = document.createElement('div');
  row.className = 'step-row';
  row.innerHTML = `<input placeholder="ขั้นตอนที่ ${n}..."><button onclick="removeStep(this)" title="ลบ"><i class="ti ti-x"></i></button>`;
  c.appendChild(row);
  row.querySelector('input').focus();
}
function removeStep(btn) {
  const c = document.getElementById('stepsInput');
  if (c.children.length > 1) btn.parentElement.remove();
  else btn.parentElement.querySelector('input').value = '';
}

function handleFileImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const arr = Array.isArray(data) ? data : [data];
      const folderId = document.getElementById('importFolder').value || null;
      let count = 0;
      arr.forEach(s => {
        if (s.title) {
          store.sops.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,6), folderId:folderId||s.folderId||null, title:s.title, problem:s.problem||'', fixture:s.fixture||'', customer:s.customer||'', desc:s.desc||'', steps:s.steps||[]});
          count++;
        }
      });
      closeImportModal(); filterSOPs(); renderFolders(); save();
      toast(`นำเข้า ${count} รายการสำเร็จ`, 'ti-check');
    } catch(err) { alert('ไฟล์ JSON ไม่ถูกต้อง กรุณาตรวจสอบรูปแบบ'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function saveManualSOP() {
  const title = document.getElementById('sopTitle').value.trim();
  if (!title) { alert('กรุณาใส่ชื่อ SOP / ปัญหา'); return; }
  const steps = [...document.getElementById('stepsInput').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  const folderId = document.getElementById('importFolder').value || null;
  store.sops.push({
    id: 's'+Date.now(),
    folderId,
    title,
    problem: title,
    fixture: document.getElementById('sopFixture').value.trim(),
    customer: document.getElementById('sopCustomer').value.trim(),
    desc: document.getElementById('sopDesc').value.trim(),
    steps
  });
  closeImportModal(); filterSOPs(); renderFolders(); save();
  toast('บันทึก SOP เรียบร้อย', 'ti-check');
}

load(); renderFolders(); filterSOPs();
</script>
</body>
</html>
